<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accessible Bus Stops — Vancouver, BC</title>
    <meta name="description" content="An interactive map of wheelchair-accessible TransLink bus stops across Metro Vancouver.">

    <!-- Brand typeface (see css/style.css design tokens: fonts.body/display) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"
        integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"
        integrity="sha384-wgw+aLYNQ7dlhK47ZPK7FRACiq7ROZwgFNg0m04avm4CaXS+Z9Y7nMu8yNjBKYC+" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip-link" href="#stop-list">Skip to stop list</a>

    <header class="app-header">
        <button type="button" id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" />
            </svg>
            <span class="visually-hidden">Toggle stop list</span>
        </button>
        <h1>Accessible Bus Stops <span class="app-header__place">Vancouver, BC</span></h1>
        <p id="data-meta" class="app-header__meta"></p>
    </header>

    <div class="app-body">
        <aside id="sidebar" class="sidebar">
            <div id="filter-bar" class="filter-bar"></div>
            <p id="load-status" class="load-status" role="status"></p>
            <div id="stop-list" class="stop-list"></div>
        </aside>

        <main id="map" class="map" aria-label="Map of accessible bus stops in Metro Vancouver"></main>

        <section id="stop-detail" class="stop-detail" hidden aria-live="polite" aria-label="Stop details"></section>

        <div id="weather-box" class="weather-box" hidden>
            <span aria-hidden="true">🌤️</span>
            <span id="weather-text"></span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"
        integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
